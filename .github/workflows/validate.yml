name: Validate

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse source and verify RixFlix invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          for path in Path('.').rglob('*.xml'):
              ET.parse(path)
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          addon = ET.parse('addon.xml').getroot()
          assert addon.get('id') == 'skin.rixflix'
          assert addon.get('name') == 'RixFlix'
          # NOT a frozen literal. This was pinned to 1.5.4 and every push since has
          # failed on it alone, which made the whole file below decoration — a guard
          # that dies before it evaluates anything still "runs". Assert the SHAPE, and
          # let the real invariants underneath be the thing that can fail.
          assert re.fullmatch(r'\d+\.\d+\.\d+', addon.get('version')), addon.get('version')
          assets = {
              'media/rixflix/rix-badge.png',
              'media/rixflix/rixflix-splash.png',
              'media/rixflix/rixflix-wordmark.png',
          }
          assert all(Path(path).is_file() for path in assets)
          startup = Path('1080i/Includes_Objects.xml').read_text()
          assert 'special://skin/media/rixflix/rixflix-wordmark.png' in startup
          assert '[COLOR=main_logo]Arctic[/COLOR] Fuse' not in startup
          assert 'Window(Weather).Property(Current.Temperature)' not in startup
          background = Path('1080i/Includes_Background.xml').read_text()
          assert '<include name="Background_RixFlix_StartUp">' in background
          assert 'special://skin/media/rixflix/rixflix-splash.png' in background
          hubs = Path('1080i/Includes_Hubs.xml').read_text()
          splash = hubs[hubs.index('<include name="Hub_Widget_Splash">'):]
          assert '<include>Background_RixFlix_StartUp</include>' in splash
          assert '<include>Object_StartUp_Logo</include>' not in splash
          assert 'special://skin/media/rixflix/rix-badge.png' in splash
          power = json.loads(Path('shortcuts/skinvariables-shortcut-powermenu.json').read_text())
          assert any(item.get('label') == 'Restart Kodi' and
                     item.get('path') == 'ActivateWindow(1199)'
                     for item in power)
          shutdown = ET.parse('1080i/Custom_1199_RixFlix_Shutdown.xml').getroot()
          assert shutdown.get('id') == '1199' and shutdown.get('type') == 'dialog'
          shutdown_text = Path('1080i/Custom_1199_RixFlix_Shutdown.xml').read_text()
          assert 'Hub_Widget_Splash' in shutdown_text
          assert 'Restarting RIXFLIX' in shutdown_text
          assert 'rixflix-kodi-safe-quit.sh' in shutdown_text
          assert '00:01,silent' in shutdown_text
          startup_actions = Path('shortcuts/skinvariables-startup.json').read_text()
          assert 'Skin.Reset(tmdbhelper.enableblur)' in startup_actions
          assert 'Skin.Reset(tmdbhelper.enablecrop)' in startup_actions
          assert 'Skin.Reset(TMDbHelper.EnableBlur)' not in startup_actions
          assert 'Skin.Reset(TMDbHelper.EnableCrop)' not in startup_actions
          # The DV/HDR chip. Both halves are asserted because either one alone is a
          # silent no-op: the control without the OSD param shows the flag only in
          # browse, and the param without the control shows it nowhere at all.
          furniture = Path('1080i/Includes_Furniture.xml').read_text()
          assert 'flags/color/hdr/' in furniture
          assert '<param name="infolabel_hdrtype">ListItem.HdrType</param>' in furniture
          osd = Path('1080i/Includes_OSD.xml').read_text()
          assert '<param name="infolabel_hdrtype">VideoPlayer.HdrType</param>' in osd
          seekbar = Path('1080i/DialogSeekBar.xml').read_text()
          assert 'Label_RixFlix_PauseTitle' in seekbar
          assert 'Label_RixFlix_PauseSubTitle' in seekbar
          assert 'Player.Paused + [!String.IsEmpty(VideoPlayer.Title) | !String.IsEmpty(Player.Title)]' in seekbar
          labels = Path('1080i/Includes_Labels.xml').read_text()
          assert 'VideoPlayer.TvShowTitle' in labels[labels.index('Label_RixFlix_PauseTitle'):]
          pause_subtitle = labels[labels.index('Label_RixFlix_PauseSubTitle'):]
          assert '$INFO[VideoPlayer.Season,S]$INFO[VideoPlayer.Episode,E]' in pause_subtitle
          # Enumerated visibility, not a bare infolabel: Kodi also emits `hdr10plus` and
          # this skin has no texture for it, so an unguarded control would reserve a slot
          # in the codec grouplist and draw nothing.
          assert 'String.IsEqual($PARAM[infolabel_hdrtype],dolbyvision)' in furniture
          for flag in ('dolbyvision', 'hdr10', 'hlg'):
              assert Path('media/flags/color/hdr/%s.png' % flag).is_file(), flag

          search = Path('1080i/Includes_Search.xml').read_text()
          active_search = search[:search.index('<include name="Search_Bar_Keys">')]
          assert '<include>Search_Bar_Help</include>' in active_search
          assert '<include>Search_Bar_Keys</include>' not in active_search
          assert '<hinttext>Press OK to enter a title</hinttext>' in active_search
          assert '<ondown>601</ondown>' in active_search

          timers = ET.parse('1080i/Timers.xml').getroot()
          trailer = next(timer for timer in timers.findall('timer')
                         if timer.findtext('name') == 'rixflix_spotlight_trailer')
          assert 'Container(301).ListItem.Trailer' in trailer.findtext('start')
          assert 'Skin.HasSetting(RixFlix.EnableAutoplayTrailers)' in trailer.findtext('start')
          assert trailer.find('start').get('reset') == 'false'
          assert 'String.IsEqual(System.CurrentWindow,Home)' in trailer.findtext('start')
          assert 'System.CurrentWindow' not in trailer.findtext('stop')
          assert 'Player.Filenameandpath' in trailer.findtext('stop')
          assert 'Window.IsVisible(home)' not in trailer.findtext('start')
          assert 'Window.IsVisible(home)' not in trailer.findtext('stop')
          assert 'Window.IsActive(home)' not in trailer.findtext('start')
          assert 'Window.IsActive(home)' not in trailer.findtext('stop')
          assert 'Skin.TimerElapsedSecs(rixflix_spotlight_trailer),20' in trailer.findtext('stop')
          assert trailer.findtext('stop').count('Skin.TimerElapsedSecs') == 1
          assert 'Container(301).ListItem.Trailer' in trailer.findtext('stop')
          assert 'Hub_Spotlight_Visible_Expression' not in trailer.findtext('start')
          assert 'Hub_Spotlight_Visible_Expression' not in trailer.findtext('stop')
          assert all('$EXP[' not in (timer.findtext(tag) or '')
                     for timer in timers.findall('timer')
                     for tag in ('start', 'reset', 'stop'))
          assert any('RunScript(special://skin/scripts/rixflix_trailer.py,' in (action.text or '')
                     for action in trailer.findall('onstart'))
          stop_actions = [action for action in trailer.findall('onstop')
                          if 'PlayerControl(Stop)' in (action.text or '')]
          assert len(stop_actions) == 1
          assert 'RixFlix.AutoplayTrailerResolved' in stop_actions[0].get('condition')
          assert 'Player.FileNameAndPath' not in trailer.findtext('start')
          home = Path('1080i/Home.xml').read_text()
          assert 'RixFlix.AutoplayTrailer' not in home
          spotlight = hubs[hubs.index('<include name="Hub_Spotlight_List">'):]
          spotlight = spotlight[:spotlight.index('</definition>')]
          assert 'String.IsEmpty(Window(Home).Property(RixFlix.AutoplayTrailer))' in spotlight
          assert '<param name="label">$VAR[Label_RixFlix_TrailerButton]</param>' in hubs
          assert 'rixflix_trailer.py,$ESCINFO[Container(301).ListItem.Trailer],foreground' in hubs
          assert 'RixFlix.UnavailableTrailer' in hubs
          labels = Path('1080i/Includes_Labels.xml').read_text()
          assert 'Loading Trailer' in labels
          hero_play = hubs[hubs.index('PlayerControl(Stop)'):]
          assert 'ClearProperty(RixFlix.AutoplayTrailer,Home)' in hero_play
          assert 'ClearProperty(RixFlix.AutoplayTrailerResolved,Home)' in hero_play
          resolver = Path('scripts/rixflix_trailer.py')
          assert resolver.is_file()
          compile(resolver.read_text(), 'rixflix_trailer.py', 'exec')
          assert 'RixFlix.OnDemandTrailerResolved' in resolver.read_text()
          assert 'inputstream.adaptive' in resolver.read_text()
          constants = ET.parse('1080i/Includes_Constants.xml').getroot()
          values = {node.get('name'): (node.text or '').strip()
                    for node in constants.findall('constant')}
          assert values['view_poster_itemlayout_w'] == '300'
          assert values['view_poster_item_w'] == '260'
          assert values['view_poster_movement'] == '5'
          # UP NEXT IS RETIRED AND STAYS RETIRED (2026-08-30). Rick: the popup is
          # "unnecessary and just in the way" — it took the screen and Select over the
          # last 40-150 s of every episode. The add-on is deleted from the AM9 on every
          # deploy (Rixflix am9/deploy.sh), so a skin that references service.upnext can
          # only produce a dead button or a dialog with nothing behind it. The reference
          # is what has to be impossible, not just the add-on: an "add Up Next back"
          # change fails HERE, in CI, instead of on the television.
          upnext = [str(path) for path in Path('.').rglob('*')
                    if path.is_file() and '.git' not in path.parts
                    and 'service.upnext' in path.read_text(errors='ignore')]
          assert upnext == ['.github/workflows/validate.yml'], upnext
          stale = [str(path) for path in Path('.').rglob('*')
                   if path.is_file() and '.git' not in path.parts
                   and 'skin.arctic.fuse.3' in path.read_text(errors='ignore')]
          allowed = {'Readme.md', '.github/workflows/validate.yml'}
          assert set(stale) <= allowed, stale
          print('PASS: source parsed; identity, branding, restart, performance and Up-Next-stays-gone invariants hold')
          PY
