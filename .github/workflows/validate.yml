name: Validate

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse source and verify RixFlix invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          for path in Path('.').rglob('*.xml'):
              ET.parse(path)
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          addon = ET.parse('addon.xml').getroot()
          assert addon.get('id') == 'skin.rixflix'
          assert addon.get('name') == 'RixFlix'
          assert addon.get('version') == '1.5.3'
          assets = {
              'media/rixflix/rix-badge.png',
              'media/rixflix/rixflix-splash.png',
              'media/rixflix/rixflix-wordmark.png',
          }
          assert all(Path(path).is_file() for path in assets)
          startup = Path('1080i/Includes_Objects.xml').read_text()
          assert 'special://skin/media/rixflix/rixflix-wordmark.png' in startup
          assert '[COLOR=main_logo]Arctic[/COLOR] Fuse' not in startup
          assert 'Window(Weather).Property(Current.Temperature)' not in startup
          background = Path('1080i/Includes_Background.xml').read_text()
          assert '<include name="Background_RixFlix_StartUp">' in background
          assert 'special://skin/media/rixflix/rixflix-splash.png' in background
          hubs = Path('1080i/Includes_Hubs.xml').read_text()
          splash = hubs[hubs.index('<include name="Hub_Widget_Splash">'):]
          assert '<include>Background_RixFlix_StartUp</include>' in splash
          assert '<include>Object_StartUp_Logo</include>' not in splash
          assert 'special://skin/media/rixflix/rix-badge.png' in splash
          power = json.loads(Path('shortcuts/skinvariables-shortcut-powermenu.json').read_text())
          assert any(item.get('label') == 'Restart Kodi' and
                     item.get('path') == 'System.Exec(/storage/.config/rixflix-kodi-safe-quit.sh)'
                     for item in power)
          startup_actions = Path('shortcuts/skinvariables-startup.json').read_text()
          assert 'Skin.Reset(tmdbhelper.enableblur)' in startup_actions
          assert 'Skin.Reset(tmdbhelper.enablecrop)' in startup_actions
          assert 'Skin.Reset(TMDbHelper.EnableBlur)' not in startup_actions
          assert 'Skin.Reset(TMDbHelper.EnableCrop)' not in startup_actions
          # The DV/HDR chip. Both halves are asserted because either one alone is a
          # silent no-op: the control without the OSD param shows the flag only in
          # browse, and the param without the control shows it nowhere at all.
          furniture = Path('1080i/Includes_Furniture.xml').read_text()
          assert 'flags/color/hdr/' in furniture
          assert '<param name="infolabel_hdrtype">ListItem.HdrType</param>' in furniture
          osd = Path('1080i/Includes_OSD.xml').read_text()
          assert '<param name="infolabel_hdrtype">VideoPlayer.HdrType</param>' in osd
          # Enumerated visibility, not a bare infolabel: Kodi also emits `hdr10plus` and
          # this skin has no texture for it, so an unguarded control would reserve a slot
          # in the codec grouplist and draw nothing.
          assert 'String.IsEqual($PARAM[infolabel_hdrtype],dolbyvision)' in furniture
          for flag in ('dolbyvision', 'hdr10', 'hlg'):
              assert Path('media/flags/color/hdr/%s.png' % flag).is_file(), flag

          search = Path('1080i/Includes_Search.xml').read_text()
          active_search = search[:search.index('<include name="Search_Bar_Keys">')]
          assert '<include>Search_Bar_Help</include>' in active_search
          assert '<include>Search_Bar_Keys</include>' not in active_search
          assert '<hinttext>Press OK to enter a title</hinttext>' in active_search
          assert '<ondown>601</ondown>' in active_search

          timers = ET.parse('1080i/Timers.xml').getroot()
          trailer = next(timer for timer in timers.findall('timer')
                         if timer.findtext('name') == 'rixflix_spotlight_trailer')
          assert 'Container(301).ListItem.Trailer' in trailer.findtext('start')
          assert 'Window.IsVisible(home)' in trailer.findtext('start')
          assert '!Window.IsVisible(home)' in trailer.findtext('stop')
          assert 'Window.IsActive(home)' not in trailer.findtext('start')
          assert 'Window.IsActive(home)' not in trailer.findtext('stop')
          assert all('$EXP[' not in (timer.findtext(tag) or '')
                     for timer in timers.findall('timer')
                     for tag in ('start', 'reset', 'stop'))
          assert any('PlayMedia(' in (action.text or '') and ',1,noresume)' in (action.text or '')
                     for action in trailer.findall('onstart'))
          assert any('PlayerControl(Stop)' in (action.text or '')
                     for action in trailer.findall('onstop'))
          assert all('Player.FileNameAndPath' not in (timer.findtext(tag) or '')
                     for timer in timers.findall('timer')
                     for tag in ('start', 'reset', 'stop'))
          hubs = Path('1080i/Includes_Hubs.xml').read_text()
          hero_play = hubs[hubs.index('<param name="id">311</param>'):]
          hero_play = hero_play[:hero_play.index('<param name="id">312</param>')]
          assert 'PlayerControl(Stop)' in hero_play
          assert 'ClearProperty(RixFlix.AutoplayTrailer,Home)' in hero_play
          constants = ET.parse('1080i/Includes_Constants.xml').getroot()
          values = {node.get('name'): (node.text or '').strip()
                    for node in constants.findall('constant')}
          assert values['view_poster_itemlayout_w'] == '300'
          assert values['view_poster_item_w'] == '260'
          assert values['view_poster_movement'] == '5'
          stale = [str(path) for path in Path('.').rglob('*')
                   if path.is_file() and '.git' not in path.parts
                   and 'skin.arctic.fuse.3' in path.read_text(errors='ignore')]
          allowed = {'Readme.md', '.github/workflows/validate.yml'}
          assert set(stale) <= allowed, stale
          print('PASS: source parsed; identity, branding, restart, and performance invariants hold')
          PY
